# Weekly encrypted backup of the Sika Track database (Supabase Postgres).
#
# Why encrypted: this repo is public, and anyone signed in to GitHub can
# download a public repo's workflow artifacts. The backup is encrypted with
# BACKUP_PASSPHRASE, so the file is useless without it.
#
# Setup (once): add two repository secrets (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL  Supabase "Session pooler" connection string (Connect button)
#   BACKUP_PASSPHRASE    Long random password — store it safely; without it backups can't be opened
#
# Restore steps: see README → "Backups".
name: Weekly database backup

on:
  schedule:
    - cron: "17 2 * * 0"  # Sundays 02:17 UTC (quiet time; off the busy top of the hour)
  workflow_dispatch:      # "Run workflow" button for a manual backup or a test

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets are set
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ]; then
            echo "::error::Add the BACKUP_DATABASE_URL repository secret (Supabase Session pooler URL)"; exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 16 ]; then
            echo "::error::BACKUP_PASSPHRASE secret is missing or shorter than 16 characters"; exit 1
          fi

      - name: Dump database
        # postgres:17 image = pg_dump 17, matching Supabase's Postgres 17
        run: |
          docker run --rm -e DB_URL="$BACKUP_DATABASE_URL" postgres:17 \
            sh -c 'pg_dump "$DB_URL" --schema=public --no-owner --no-privileges --inserts' > backup.sql
          if ! grep -q "CREATE TABLE public.transactions" backup.sql; then
            echo "::error::Backup doesn't contain the transactions table — check BACKUP_DATABASE_URL"; exit 1
          fi
          # Drop psql-only \restrict lines so the file also pastes into Supabase's SQL editor
          sed -i '/^\\restrict /d; /^\\unrestrict /d' backup.sql
          echo "Backup size: $(wc -c < backup.sql) bytes"

      - name: Compress and encrypt
        run: |
          gzip -9 backup.sql
          FILE="sika-track-$(date -u +%Y-%m-%d).sql.gz.gpg"
          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "$FILE" backup.sql.gz
          shred -u backup.sql.gz  # Never leave an unencrypted copy behind

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90  # ~13 weekly backups kept; older ones auto-delete
          if-no-files-found: error
